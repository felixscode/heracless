[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "heracless"
# The version is taken from Cargo.toml, the single source of truth.
dynamic = ["version"]
dependencies = []
requires-python = ">=3.10"
authors = [
    {name = "Felix Schelling", email = "felix.schelling@protonmail.com"},
]
description = "Type-safe YAML configuration: load YAML as typed dataclasses with generated stubs (Rust-powered)"
keywords = ["YAML", "Dataclass", "Config", "config", "config management", "typing"]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.scripts]
heracless = "heracless.cli_tool:run_cli"

[project.urls]
Repository = "https://github.com/felixscode/heracless.git"
Homepage = "https://heracless-py.com"
Documentation = "https://heracless-py.com"

[project.optional-dependencies]
dev = [
    "maturin>=1.9.4,<2.0",
    "pytest",
    "pytest-cov",
    "mypy",
    # Only used by the test-suite, to check that YAML is resolved exactly like PyYAML does.
    "PyYAML",
    "types-PyYAML",
]
doc = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.maturin]
python-source = "."
module-name = "heracless._core"
features = ["python"]
include = [{ path = "heracless/py.typed", format = ["sdist", "wheel"] }]

[tool.black]
line-length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["heracless"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
