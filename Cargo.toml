[package]
name = "heracless"
version = "0.6.0"
edition = "2021"
authors = ["Felix Schelling <felix.schelling@protonmail.com>"]
description = "Type-safe YAML configuration management - Rust core of the heracless Python library"
keywords = ["yaml", "config", "configuration", "type-safe", "python"]
categories = ["config", "development-tools"]
license = "MIT"
repository = "https://github.com/felixscode/heracless"
homepage = "https://heracless.io"
readme = "README.md"
rust-version = "1.83"
exclude = ["/.github", "/docs", "/tests", "/heracless", "/config", "uv.lock", "mkdocs.yml"]

[lib]
name = "heracless"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Python bindings. Enabled by maturin (see `[tool.maturin]` in pyproject.toml);
# pure Rust users don't pay for PyO3.
python = ["dep:pyo3"]

[dependencies]
indexmap = "2"
pyo3 = { version = "0.30", optional = true, features = ["abi3-py310"] }
regex = "1.10"
thiserror = "2"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3.10"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
