name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-version:
    name: Validate version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Get tag version
      id: get_version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
        echo "Tag version: $TAG_VERSION"

    - name: Get package version
      id: get_package_version
      run: |
        # The version lives in Cargo.toml; pyproject.toml declares it dynamic.
        PACKAGE_VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d'"' -f2)
        echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        echo "Cargo.toml version: $PACKAGE_VERSION"

    - name: Compare versions
      run: |
        TAG_VERSION="${{ steps.get_version.outputs.version }}"
        PACKAGE_VERSION="${{ steps.get_package_version.outputs.package_version }}"

        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "❌ Version mismatch!"
          echo "Tag version: v$TAG_VERSION"
          echo "Cargo.toml version: $PACKAGE_VERSION"
          exit 1
        fi

        echo "✅ Versions match: $TAG_VERSION"

  test:
    name: Run tests before publishing
    needs: validate-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Rust tests
      run: cargo test

    - name: Run tests
      run: pytest tests/ -v

    - name: Run mypy
      run: mypy heracless/

  build-wheels:
    # The extension uses the stable ABI (abi3), so one wheel per platform covers Python 3.10+.
    name: Build wheels (${{ matrix.platform.os }}, ${{ matrix.platform.target }})
    needs: test
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: universal2-apple-darwin }

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.platform.target }}
        args: --release --out dist
        manylinux: auto

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.platform.os }}-${{ matrix.platform.target }}
        path: dist/
        retention-days: 7

  build-sdist:
    name: Build source distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-sdist
        path: dist/
        retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI (optional)
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.repository == 'felixscode/heracless'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/heracless

    steps:
    - name: Download build artifacts from all platforms
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist-downloads/
        merge-multiple: true

    - name: Merge artifacts
      run: |
        mkdir -p dist
        mv dist-downloads/* dist/
        python -m pip install --upgrade twine
        twine check dist/*

    - name: Publish to TestPyPI
      if: vars.PUBLISH_TO_TESTPYPI == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
        print-hash: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.repository == 'felixscode/heracless'
    environment:
      name: pypi
      url: https://pypi.org/project/heracless
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
    - name: Download build artifacts from all platforms
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist-downloads/
        merge-multiple: true

    - name: Merge artifacts
      run: |
        mkdir -p dist
        mv dist-downloads/* dist/
        python -m pip install --upgrade twine
        twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        print-hash: true

  create-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
